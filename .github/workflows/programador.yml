name: Instalar el programador

# Sube a Cloudflare el pequeño programa que lanza la actualización de torneos a su hora
# (workers/programador). Se lanza a mano una vez, y otra si cambias los horarios.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['workers/programador/**']

permissions:
  contents: read

jobs:
  instalar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Subir a Cloudflare
        working-directory: workers/programador
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Darle la llave de GitHub
        working-directory: workers/programador
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          [ -n "$GH_DISPATCH_TOKEN" ] || { echo "::error::Falta el secreto GH_DISPATCH_TOKEN (ver README, «Actualización tres veces al día»). El programador está subido, pero no lanzará nada hasta tenerlo."; exit 1; }
          printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@4 secret put GH_TOKEN
