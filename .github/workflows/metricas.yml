name: Métricas semanales
# Sin IA: cada lunes cuenta suscriptores, altas, avisos y torneos y lo guarda en agentes/historico/.
on:
  schedule:
    - cron: "5 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: metricas, cancel-in-progress: false }
jobs:
  metricas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Calcular
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 agentes/tools/metricas.py
      - name: Guardar
        run: |
          git config user.name "banderin-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agentes/historico
          git diff --cached --quiet && exit 0
          git commit -m "Métricas de la semana $(date -u +%G-W%V)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
