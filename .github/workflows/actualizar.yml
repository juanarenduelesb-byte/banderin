name: Actualizar torneos

on:
  schedule:
    # GitHub retrasa horas (o se salta) las tareas programadas: la de las 5:23 llegaba a las 12:37.
    # Por eso se intenta cada hora en dos ventanas, y el trabajo «decidir» deja pasar solo la primera
    # de cada ventana que llegue; las demás terminan en segundos. Hora UTC (Madrid = +1 en invierno).
    - cron: '17 4-10 * * *'   # mañana: de 5:17 a 11:17
    - cron: '47 12-16 * * *'  # tarde: de 13:47 a 17:47
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.d.outputs.go }}
    steps:
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          EV: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          if [ "$EV" != "schedule" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          H=$(date -u +%H); D=$(date -u +%Y-%m-%d)
          if [ "$H" -lt 12 ]; then A="${D}T04:00:00Z"; B="${D}T12:00:00Z"; else A="${D}T12:00:00Z"; B="${D}T23:59:59Z"; fi
          # Solo cuentan las pasadas que actualizaron de verdad (o están en ello); las que se saltaron no.
          OK=$(gh api "repos/$REPO/actions/workflows/actualizar.yml/runs?created=%3E%3D$A&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != $RUN and .created_at < \"$B\")] | map(.id) | join(\" \")")
          HECHO=0
          for R in $OK; do
            J=$(gh api "repos/$REPO/actions/runs/$R/jobs" --jq '[.jobs[] | select(.name == "actualizar") | select(.conclusion == "success" or .status != "completed")] | length')
            [ "$J" -gt 0 ] && HECHO=1 && break
          done
          echo "¿ya se actualizó en esta ventana? $HECHO"
          if [ "$HECHO" = 1 ]; then echo "go=0" >> "$GITHUB_OUTPUT"; else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: Vigilancia (si falla, GitHub te avisa por correo)
        if: github.event_name == 'schedule'
        run: |
          C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://banderin.es/)
          [ "$C" = "200" ] || { echo "::error::banderin.es responde $C"; exit 1; }
          R=$(curl -s --max-time 20 "https://banderin.es/data.js?nc=$(date +%s)" | head -c 400 | grep -o 'REVISION="[^"]*"' | cut -d'"' -f2)
          [ -n "$R" ] || { echo "::error::No se puede leer la fecha de los datos"; exit 1; }
          H=$(( ( $(date -u +%s) - $(TZ=Europe/Madrid date -d "$R" +%s) ) / 3600 ))
          echo "Última revisión de los datos: $R (hace $H h)"
          [ "$H" -lt 30 ] || { echo "::error::Los torneos llevan $H horas sin revisarse"; exit 1; }

  actualizar:
    needs: decidir
    if: ${{ always() && needs.decidir.outputs.go == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: actualizar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Rutas de trabajo
        run: |
          sudo mkdir -p /home/claude/raw
          sudo chown -R "$USER" /home/claude
          ln -sfn "$GITHUB_WORKSPACE/pipeline" /home/claude/scr
          mkdir -p /tmp/banderin/nuevo /tmp/banderin/anterior
          cp site/data.js /tmp/banderin/anterior/data.js

      - name: Leer las fuentes y generar los datos
        env:
          TZ: Europe/Madrid
        run: |
          cd pipeline
          bash update.sh /tmp/banderin/nuevo/data.js /tmp/banderin/anterior/data.js
          python3 -c "import json;print(json.dumps(json.load(open('/home/claude/raw/fed2/extra.json'))['status'],ensure_ascii=False))" || true

      - name: Validar
        run: node pipeline/validate.mjs /tmp/banderin/nuevo/data.js /tmp/banderin/nuevo/pasados.js /tmp/banderin/anterior/data.js

      - name: Publicar
        run: |
          git config user.name "Banderín (actualización diaria)"
          git config user.email "actions@users.noreply.github.com"
          cp pipeline/geo_cache.json /tmp/banderin/geo_cache.json
          publicar() {
            cp /tmp/banderin/nuevo/data.js /tmp/banderin/nuevo/pasados.js site/
            cp /tmp/banderin/geo_cache.json pipeline/geo_cache.json
            python3 pipeline/clubes.py || echo "AVISO: no se pudo actualizar el directorio de clubes"
            python3 pipeline/seo.py
            python3 pipeline/calendarios.py
            git add -A site/ pipeline/geo_cache.json pipeline/datos/
            if git diff --cached --quiet; then echo "Sin cambios"; return 0; fi
            git commit -q -m "Torneos actualizados $(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')"
          }
          publicar
          # Si alguien ha subido cambios mientras tanto, se rehace sobre la versión nueva
          for intento in 1 2 3; do
            if git push; then exit 0; fi
            echo "La rama ha cambiado; se rehace la publicación (intento $intento)"
            sleep $((intento * 5))
            git fetch -q origin main
            git reset -q --hard origin/main
            publicar
          done
          exit 1
      - name: Avisos por correo
        # Apagado hasta crear la variable AVISOS=on y los secretos (ver README, «Activar los avisos»).
        if: ${{ vars.AVISOS == 'on' }}
        env:
          AVISOS: ${{ vars.AVISOS }}
          SITE_URL: https://banderin.es
          AVISOS_FROM: ${{ vars.AVISOS_FROM }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Compara con los torneos tal como estaban cuando salió el último correo, no con la pasada anterior:
          # así no se pierde lo que cambió en una pasada de la tarde, cuando ese día ya se había enviado el correo.
          PREV=/tmp/banderin/anterior/data.js
          DESDE=$(python3 pipeline/avisos.py --desde || true)
          if [ -n "$DESDE" ]; then
            SHA=$(gh api "repos/$REPO/commits?path=site/data.js&until=$DESDE&per_page=1" --jq '.[0].sha' || true)
            if [ -n "$SHA" ] && gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/site/data.js?ref=$SHA" > /tmp/banderin/base.js && [ -s /tmp/banderin/base.js ]; then
              PREV=/tmp/banderin/base.js; echo "avisos: comparo con los torneos de $DESDE ($SHA)"
            fi
          fi
          python3 pipeline/avisos.py /tmp/banderin/nuevo/data.js "$PREV"
