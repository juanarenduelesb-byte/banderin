name: Copia de seguridad

# Cada lunes a las 3:41 UTC. La copia queda como artefacto privado del repositorio 35 días
# (solo lo ven quienes tienen acceso al repositorio) y después se borra sola.
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Avisos (Cloudflare D1)
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: mkdir -p copia && python3 pipeline/copia.py copia/d1-avisos.json
      - name: Cuentas (Supabase)
        # Solo si existe el secreto SUPABASE_DB_URL (cadena de conexión de Supabase → Connect → Session pooler).
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "Sin SUPABASE_DB_URL: se omite la copia de Supabase"; exit 0; fi
          docker run --rm -e U="$SUPABASE_DB_URL" postgres:17 sh -c 'pg_dump "$U" --schema=public --schema=auth --no-owner --no-privileges' > copia/supabase.sql
          ls -la copia
      - name: Cifrar la copia
        # Con el secreto BACKUP_PASSPHRASE, la copia se sube cifrada (AES-256). Para abrirla:
        #   gpg -d supabase.sql.gpg > supabase.sql   (pide la frase)
        env:
          P: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$P" ]; then echo "::warning::Sin BACKUP_PASSPHRASE: la copia (correos y hashes de contraseñas) se sube SIN cifrar"; exit 0; fi
          for f in copia/*; do
            printf '%s' "$P" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
            shred -u "$f" 2>/dev/null || rm -f "$f"
          done
          ls -la copia
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: copia-${{ github.run_number }}
          path: copia/
          retention-days: 35
