<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Banderín Social · Encuentra con quién jugar (prueba)</title>
<meta name="description" content="Versión de prueba de Banderín Social: publica partidas, busca pareja para torneos y conoce golfistas de tu zona.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#123526">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preload" href="/fonts/public-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/libre-caslon-display-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Public Sans";font-weight:400;font-display:swap;src:url(/fonts/public-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Public Sans";font-weight:600;font-display:swap;src:url(/fonts/public-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Public Sans";font-weight:700;font-display:swap;src:url(/fonts/public-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Libre Caslon Display";font-weight:400;font-display:swap;src:url(/fonts/libre-caslon-display-latin-400-normal.woff2) format("woff2")}
:root{--surface:#F1F0E8;--ink:#0E1A14;--muted:#56645C;--accent:#17643F;--on-accent:#fff;--tint:#E2EDE4;--hair:#D9DED5;--w1:#9ED9B0;--w2:#C6E2EE;--w3:#EBD3A3;
--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.72);--edge:rgba(255,255,255,.8);--shadow:0 18px 50px -26px rgba(14,40,26,.4);--hero:#123526;--hero-ink:#F4F1E8;--hero-muted:#BFCDC4;
--gold:#8A6D3B;--gold-l:#C9A86A;--crit:#B83232;--warn:#7E520D;--scrim:rgba(8,20,14,.42);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--surface:#07100C;--ink:#ECF2EE;--muted:#93A49A;--accent:#7FD6A0;--on-accent:#052014;--tint:#10281C;--hair:#22332A;--w1:#0F4A30;--w2:#14344A;--w3:#4A3A1E;
--glass:rgba(18,30,24,.55);--glass2:rgba(24,38,31,.75);--edge:rgba(255,255,255,.08);--hero:#0B2219;--gold:#D4B27A;--gold-l:#D4B27A;--crit:#F57A7A;--warn:#F2C35B;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface);color:var(--ink);font:16px/1.5 "Public Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.serif{font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;letter-spacing:-.01em}
.water{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.water i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.water i:nth-child(1){width:520px;height:520px;left:-180px;top:-200px;background:var(--w1);animation:drift 30s ease-in-out infinite alternate}
.water i:nth-child(2){width:460px;height:460px;right:-200px;top:220px;background:var(--w2);animation:drift 36s ease-in-out infinite alternate-reverse}
.water i:nth-child(3){width:420px;height:420px;left:10%;bottom:-220px;background:var(--w3);animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60px,40px) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.water i{animation:none}*{transition:none!important;animation:none!important}}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--edge),var(--shadow)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
/* Barra superior */
.top{position:sticky;top:0;z-index:30;padding:10px 0 6px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .bar{display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 6px 6px 16px}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:-.03em;font-size:18px;color:var(--ink);text-decoration:none}
.brand svg{width:22px;height:22px}
.brand small{font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-l);border-radius:999px;padding:1px 7px;margin-left:2px}
.top .sp{flex:1}
.me{width:38px;height:38px;border-radius:50%;border:0;padding:0;cursor:pointer;background:none}
/* Botones */
.btn{font-size:15px;font-weight:600;border-radius:999px;padding:0 18px;height:44px;border:1px solid transparent;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.3,.5,1),background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.gold{background:linear-gradient(180deg,#D9BC7E,#B8955A);color:#1B1408}
.btn.soft{background:var(--tint);color:var(--accent)}
.btn.ghost{background:transparent;border-color:var(--hair);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--hair);color:var(--crit)}
.btn.sm{height:36px;font-size:14px;padding:0 14px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view:focus,#view:focus-visible{outline:none}
/* Cabeceras */
.hero{margin:14px 0 8px;border-radius:30px;padding:22px 20px 20px;background:radial-gradient(120% 140% at 100% 0%,#1E5A3E 0%,var(--hero) 55%);color:var(--hero-ink);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,106,.35),transparent 70%)}
.hero .eb{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-l);margin:0 0 6px}
.hero h1{font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1.02;margin:0 0 8px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--hero-muted);font-size:15px;max-width:440px}
.hero .acts{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap}
.hero .btn.ghost{border-color:rgba(244,241,232,.3);color:var(--hero-ink)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 4px 10px}
.sec h2{margin:0;font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:24px;letter-spacing:-.01em}
.sec a,.sec button.link{font-size:14px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;text-decoration:none;padding:0}
.lede{color:var(--muted);font-size:14px;margin:-4px 4px 12px}
/* Filtros */
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:var(--glass2);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.pill[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
select.pill{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat}
/* Tarjetas de partida */
.list{display:grid;gap:10px}
.match{display:grid;grid-template-columns:64px 1fr;gap:14px;border-radius:24px;padding:14px;text-decoration:none;color:inherit;transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.match:active{transform:scale(.985)}
.date{border-radius:18px;background:var(--hero);color:var(--hero-ink);text-align:center;padding:8px 4px 9px;align-self:start}
.date small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-l)}
.date b{display:block;font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:30px;line-height:1}
.date span{display:block;font-size:12px;color:var(--hero-muted);margin-top:2px}
.match h3{margin:0 0 2px;font-size:17px;letter-spacing:-.02em;line-height:1.25}
.match .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.match .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.match .foot .who{flex:1}
.who .hcp{flex:none}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--tint);color:var(--accent);white-space:nowrap}
.tag.gold{background:rgba(201,168,106,.18);color:var(--gold)}
.tag.mute{background:transparent;border:1px solid var(--hair);color:var(--muted)}
.seats{display:flex;gap:4px;align-items:center}
.seats i{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent)}
.seats i.on{background:var(--accent)}
.seats{flex:none}.seats em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);margin-left:4px;white-space:nowrap}
/* Avatares */
.av{flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;letter-spacing:-.02em;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.av.s{width:28px;height:28px;font-size:11px}.av.m{width:44px;height:44px;font-size:16px}.av.l{width:84px;height:84px;font-size:30px;font-family:"Libre Caslon Display",Georgia,serif;font-weight:400}
.hcp{display:inline-flex;align-items:baseline;gap:3px;font-weight:700;font-variant-numeric:tabular-nums}
.hcp small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* Carrusel de torneos por parejas */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tcard{flex:0 0 78%;max-width:300px;scroll-snap-align:start;border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tcard h4{margin:0;font-size:15px;line-height:1.25;letter-spacing:-.01em}
.tcard p{margin:0;font-size:13px;color:var(--muted)}
.tcard .btn{margin-top:auto}
/* Paneles */
.panel{border-radius:28px;padding:18px}
.panel+.panel{margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:15px}
.row .grow span{font-size:13px;color:var(--muted)}
.row a.grow{text-decoration:none;color:inherit}
.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.seg{display:flex;gap:2px;background:var(--tint);border-radius:999px;padding:3px;margin:14px 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.seg button[aria-selected=true]{background:var(--glass2);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.dot[hidden]{display:none!important}
.dot{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:999px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;padding:0 5px;margin-left:4px}
/* Formularios */
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--ink)}
.field>small{display:block;font-size:12px;color:var(--muted);margin-top:5px}
.in{width:100%;height:46px;border-radius:14px;border:1px solid var(--hair);background:var(--glass2);padding:0 14px;font-size:16px;outline:none}
textarea.in{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice label{flex:1;min-width:90px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:flex;align-items:center;justify-content:center;height:44px;border-radius:14px;border:1px solid var(--hair);background:var(--glass2);font-size:14px;font-weight:600;cursor:pointer;text-align:center;padding:0 10px}
.choice input:checked+span{border-color:var(--accent);background:var(--tint);color:var(--accent)}
.choice input:focus-visible+span{outline:2px solid var(--accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair)}
.switch:last-child{border-bottom:0}
.switch b{display:block;font-size:15px}
.switch small{display:block;font-size:12px;color:var(--muted)}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:999px;background:var(--hair);position:relative;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}
.switch input:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:5px 6px 5px 12px;background:var(--tint);color:var(--accent);border:0}
.chip button{border:0;background:rgba(0,0,0,.08);width:20px;height:20px;border-radius:50%;cursor:pointer;color:inherit;line-height:1;padding:0}
.sugg{border-radius:16px;margin-top:6px;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--hair)}
.sugg button:last-child{border-bottom:0}
.sugg button small{color:var(--muted);margin-left:6px}
.err{color:var(--crit);font-size:13px;font-weight:600;margin:6px 0 0}
/* Perfil */
.prof{text-align:center;padding:24px 18px 18px}
.prof .av{margin:0 auto 10px}
.prof h1{font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:32px;margin:0;line-height:1.05}
.prof .sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stats div{border-radius:18px;background:var(--tint);padding:10px 6px}
.stats b{display:block;font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:26px;line-height:1.05;color:var(--accent)}
.stats span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prof .acts{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.bio{font-size:15px;margin:12px 0 0;color:var(--ink)}
.contact{display:flex;gap:8px;flex-wrap:wrap}
.lock{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.lock svg{width:16px;height:16px;flex:none;margin-top:2px}
/* Detalle */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;margin:12px 4px 0;background:none;border:0;cursor:pointer;padding:0}
.dhead{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center;margin-top:12px}
.dhead .date{padding:12px 4px}
.dhead .date b{font-size:40px}
.dhead h1{margin:0;font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:30px;line-height:1.05}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}
.facts div{border-radius:18px;padding:10px 12px;background:var(--glass2);border:1px solid var(--hair)}
.facts small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts b{font-size:15px}
.note{font-size:15px;border-left:3px solid var(--gold-l);padding:2px 0 2px 12px;margin:14px 0}
.cta{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));margin-top:16px;border-radius:24px;padding:10px;display:flex;gap:8px;z-index:5}
.cta .btn{flex:1}
.more{display:flex;gap:16px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.more button{background:none;border:0;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* Barra inferior */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:2px;border-radius:999px;padding:6px;width:min(440px,calc(100% - 24px))}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:999px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;position:relative}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current=page]{color:var(--accent);background:var(--tint)}
.tabs a.plus{flex:0 0 58px}
.tabs a.plus span{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:linear-gradient(180deg,#D9BC7E,#B8955A);color:#1B1408;box-shadow:0 8px 20px -8px rgba(138,109,59,.8)}
.tabs a.plus[aria-current=page]{background:none}
.tabs .dot{position:absolute;top:2px;left:calc(50% + 6px);margin:0}
/* Avisos */
.banner{display:flex;gap:10px;align-items:center;border-radius:18px;padding:10px 14px;margin:8px 0 0;font-size:13px;background:rgba(201,168,106,.16);border:1px solid rgba(201,168,106,.45);color:var(--ink)}
.banner b{color:var(--gold)}
.banner .btn{margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:all .3s cubic-bezier(.3,1.3,.5,1);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet.on{display:flex;animation:fade .2s}
.sheet .box{width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));background:var(--surface);animation:up .35s cubic-bezier(.3,1.2,.5,1)}
.sheet .grab{width:42px;height:5px;border-radius:999px;background:var(--hair);margin:4px auto 14px}
.sheet h2{font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:28px;margin:0 0 6px;line-height:1.1}
.sheet p.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:30px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.skel{border-radius:24px;height:108px;background:linear-gradient(90deg,var(--glass) 25%,var(--glass2) 50%,var(--glass) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:860px){.wrap{max-width:760px}.tcard{flex-basis:46%}}
</style>
</head>
<body>
<div class="water" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top"><div class="wrap"><div class="bar glass">
  <a class="brand" href="#partidas" aria-label="Banderín Social, inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8 3.5l10 3.6L8 10.6z" fill="var(--gold-l)"/><ellipse cx="7" cy="20.5" rx="4" ry="1.3" fill="currentColor" opacity=".45"/></svg>banderín<small>Social</small></a>
  <span class="sp"></span>
  <a class="btn ghost sm" href="https://banderin.es/" title="Volver a Banderín">Torneos</a>
  <button class="me" id="meBtn" aria-label="Mi perfil"></button>
</div><div id="banner"></div></div></header>
