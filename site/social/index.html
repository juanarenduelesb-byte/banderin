.date{border-radius:18px;background:var(--hero);color:var(--hero-ink);text-align:center;padding:8px 4px 9px;align-self:start}
.date small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-l)}
.date b{display:block;font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:30px;line-height:1}
.date span{display:block;font-size:12px;color:var(--hero-muted);margin-top:2px}
.match h3{margin:0 0 2px;font-size:17px;letter-spacing:-.02em;line-height:1.25}
.match .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.match .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.match .foot .who{flex:1}
.who .hcp{flex:none}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--tint);color:var(--accent);white-space:nowrap}
.tag.gold{background:rgba(201,168,106,.18);color:var(--gold)}
.tag.mute{background:transparent;border:1px solid var(--hair);color:var(--muted)}
.seats{display:flex;gap:4px;align-items:center}
.seats i{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent)}
.seats i.on{background:var(--accent)}
.seats{flex:none}.seats em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);margin-left:4px;white-space:nowrap}
/* Avatares */
.av{flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;letter-spacing:-.02em;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.av.s{width:28px;height:28px;font-size:11px}.av.m{width:44px;height:44px;font-size:16px}.av.l{width:84px;height:84px;font-size:30px;font-family:"Libre Caslon Display",Georgia,serif;font-weight:400}
.hcp{display:inline-flex;align-items:baseline;gap:3px;font-weight:700;font-variant-numeric:tabular-nums}
.hcp small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* Carrusel de torneos por parejas */
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tcard{flex:0 0 78%;max-width:300px;scroll-snap-align:start;border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tcard h4{margin:0;font-size:15px;line-height:1.25;letter-spacing:-.01em}
.tcard p{margin:0;font-size:13px;color:var(--muted)}
.tcard .btn{margin-top:auto}
/* Paneles */
.panel{border-radius:28px;padding:18px}
.panel+.panel{margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--hair)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:15px}
.row .grow span{font-size:13px;color:var(--muted)}
.row a.grow{text-decoration:none;color:inherit}
.empty{text-align:center;padding:28px 18px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.sseg{display:flex;gap:2px;background:var(--tint);border-radius:999px;padding:3px;margin:14px 0 12px}
.sseg button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.sseg button[aria-selected=true]{background:var(--glass2);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.dot[hidden]{display:none!important}
.dot{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:999px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;padding:0 5px;margin-left:4px}
/* Formularios */
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--ink)}
.field>small{display:block;font-size:12px;color:var(--muted);margin-top:5px}
.in{width:100%;height:46px;border-radius:14px;border:1px solid var(--hair);background:var(--glass2);padding:0 14px;font-size:16px;outline:none}
textarea.in{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice label{flex:1;min-width:90px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:flex;align-items:center;justify-content:center;height:44px;border-radius:14px;border:1px solid var(--hair);background:var(--glass2);font-size:14px;font-weight:600;cursor:pointer;text-align:center;padding:0 10px}
.choice input:checked+span{border-color:var(--accent);background:var(--tint);color:var(--accent)}
.choice input:focus-visible+span{outline:2px solid var(--accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--hair)}
.switch:last-child{border-bottom:0}
.switch b{display:block;font-size:15px}
.switch small{display:block;font-size:12px;color:var(--muted)}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:999px;background:var(--hair);position:relative;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}
.switch input:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:999px;padding:5px 6px 5px 12px;background:var(--tint);color:var(--accent);border:0}
.chip button{border:0;background:rgba(0,0,0,.08);width:20px;height:20px;border-radius:50%;cursor:pointer;color:inherit;line-height:1;padding:0}
.sugg{border-radius:16px;margin-top:6px;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--hair)}
.sugg button:last-child{border-bottom:0}
.sugg button small{color:var(--muted);margin-left:6px}
.err{color:var(--crit);font-size:13px;font-weight:600;margin:6px 0 0}
/* Perfil */
.prof{text-align:center;padding:24px 18px 18px}
.prof .av{margin:0 auto 10px}
.prof h1{font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:32px;margin:0;line-height:1.05}
.prof .sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.stats div{border-radius:18px;background:var(--tint);padding:10px 6px}
.stats b{display:block;font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:26px;line-height:1.05;color:var(--accent)}
.stats span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prof .acts{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.bio{font-size:15px;margin:12px 0 0;color:var(--ink)}
.contact{display:flex;gap:8px;flex-wrap:wrap}
.lock{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.lock svg{width:16px;height:16px;flex:none;margin-top:2px}
/* Detalle */
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;margin:12px 4px 0;background:none;border:0;cursor:pointer;padding:0}
.dhead{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:center;margin-top:12px}
.dhead .date{padding:12px 4px}
.dhead .date b{font-size:40px}
.dhead h1{margin:0;font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:30px;line-height:1.05}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}
.facts div{border-radius:18px;padding:10px 12px;background:var(--glass2);border:1px solid var(--hair)}
.facts small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts b{font-size:15px}
.note{font-size:15px;border-left:3px solid var(--gold-l);padding:2px 0 2px 12px;margin:14px 0}
.cta{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));margin-top:16px;border-radius:24px;padding:10px;display:flex;gap:8px;z-index:5}
.cta .btn{flex:1}
.more{display:flex;gap:16px;justify-content:center;margin:18px 0 6px;flex-wrap:wrap}
.more button{background:none;border:0;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* Avisos */
.banner{display:flex;gap:10px;align-items:center;border-radius:18px;padding:10px 14px;margin:8px 0 0;font-size:13px;background:rgba(201,168,106,.16);border:1px solid rgba(201,168,106,.45);color:var(--ink)}
.banner b{color:var(--gold)}
.banner .btn{margin-left:auto}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;transition:all .3s cubic-bezier(.3,1.3,.5,1);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet.on{display:flex;animation:fade .2s}
.sheet .box{width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));background:var(--surface);animation:up .35s cubic-bezier(.3,1.2,.5,1)}
.sheet .grab{width:42px;height:5px;border-radius:999px;background:var(--hair);margin:4px auto 14px}
.sheet h2{font-family:"Libre Caslon Display",Georgia,serif;font-weight:400;font-size:28px;margin:0 0 6px;line-height:1.1}
.sheet p.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:30px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.skel{border-radius:24px;height:108px;background:linear-gradient(90deg,var(--glass) 25%,var(--glass2) 50%,var(--glass) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
