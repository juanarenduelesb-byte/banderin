<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>chat reel</title>
<style>
@font-face{font-family:"PS";font-weight:400;src:url(/fonts/public-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"PS";font-weight:500;src:url(/fonts/public-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"PS";font-weight:600;src:url(/fonts/public-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"PS";font-weight:700;src:url(/fonts/public-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"CAS";font-weight:400;src:url(/fonts/libre-caslon-display-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Logo";font-weight:700;src:url(/fonts/instrument-sans-latin-700-normal.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B1A13;font-family:"PS","Noto Color Emoji",sans-serif;color:#F4F1E8}
#cam{position:absolute;inset:0;transform-origin:50% 60%}
#chat{position:absolute;inset:0;background:#0E1F17}
#wall{position:absolute;inset:-100px;opacity:.07}
#hdr{position:absolute;left:0;right:0;top:0;height:300px;background:rgba(14,31,23,.92);backdrop-filter:blur(20px);border-bottom:2px solid rgba(244,241,232,.07);z-index:5}
#sbar{position:absolute;left:70px;right:70px;top:38px;display:flex;justify-content:space-between;font-weight:600;font-size:40px}
#ghead{position:absolute;left:50px;right:50px;top:130px;display:flex;align-items:center;gap:28px}
#ghead .back{font-size:70px;color:#7FCF9C;line-height:1;margin-top:-8px}
#gav{width:120px;height:120px;border-radius:50%;background:#1F6B45;display:flex;align-items:center;justify-content:center;font-size:62px;flex:none}
#ghead b{display:block;font-size:46px;font-weight:700}
#ghead span{display:block;font-size:31px;color:#93A49A;margin-top:4px}
#msgs{position:absolute;left:0;right:0;top:0;padding:0 40px}
.m{display:flex;gap:18px;align-items:flex-end;margin-bottom:22px;transform-origin:0% 100%}
.m.me{flex-direction:row-reverse;transform-origin:100% 100%}
.av{width:82px;height:82px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:36px;color:#0E1F17}
.b{max-width:780px;padding:22px 32px 20px;border-radius:44px;font-size:46px;line-height:1.24;background:#F4F1E8;color:#13201A;border-bottom-left-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.me .b{background:#2C8A58;color:#fff;border-bottom-left-radius:44px;border-bottom-right-radius:14px}
.b .n{display:block;font-size:30px;font-weight:700;margin-bottom:4px}
.b .tm{font-size:26px;opacity:.55;margin-left:14px;white-space:nowrap}
.typing{display:inline-flex;gap:12px;padding:30px 34px}
.typing i{width:18px;height:18px;border-radius:50%;background:#6B7A70;display:block}
.lp{padding:12px;max-width:760px}
.lp img{display:block;width:736px;height:386px;object-fit:cover;border-radius:34px}
.lp .tx{padding:20px 20px 10px;color:#fff}
.lp .tx b{display:block;font-size:40px;font-weight:700;line-height:1.2}
.lp .tx small{display:block;font-size:31px;opacity:.85;margin-top:6px}
.lp .tx u{display:block;font-size:40px;margin-top:14px;text-decoration:underline;font-weight:600}
#input{position:absolute;left:0;right:0;bottom:0;height:200px;background:rgba(14,31,23,.95);border-top:2px solid rgba(244,241,232,.07);z-index:5}
#input .f{position:absolute;left:50px;right:180px;top:36px;height:100px;border-radius:50px;background:#1A2E24;color:#6B7A70;font-size:40px;display:flex;align-items:center;padding:0 40px}
#input .s{position:absolute;right:50px;top:36px;width:100px;height:100px;border-radius:50%;background:#2C8A58;display:flex;align-items:center;justify-content:center}
#hook{position:absolute;left:70px;right:70px;top:360px;z-index:8;text-align:center;font-family:"CAS";font-size:92px;line-height:1.05;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.6)}
#hook .g{color:#E9C77E}
#hookbg{position:absolute;left:0;right:0;top:300px;height:520px;background:linear-gradient(#0E1F17 55%,rgba(14,31,23,0));z-index:7}
#web{position:absolute;inset:0;background:#163D2B;opacity:0;z-index:20;overflow:hidden}
#wbar{position:absolute;left:0;right:0;top:0;height:170px;background:#F2EEE2;color:#13201A;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding-bottom:28px;font-weight:600;font-size:40px;gap:14px}
#wbar small{position:absolute;left:50px;bottom:28px;font-size:40px;color:#1F6B45;font-weight:600}
#wf{position:absolute;left:0;top:170px;width:390px;height:632px;border:0;transform:scale(2.7692);transform-origin:0 0}
#tap{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:7px solid rgba(255,255,255,.95);background:rgba(255,255,255,.25);opacity:0;z-index:25}
#end{position:absolute;inset:0;z-index:30;opacity:0;background:radial-gradient(110% 80% at 50% 40%,#1F5139,#123323 55%,#071710);text-align:center}
#end img{width:230px;height:230px;border-radius:54px;margin-top:470px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
#end h2{font-family:"CAS";font-weight:400;font-size:118px;line-height:1.02;margin:60px 70px 0}
#end h2 span{color:#E9C77E}
#end .u{display:inline-block;margin-top:70px;font-weight:700;font-size:82px;letter-spacing:-.02em;background:#F4F1E8;color:#163D2B;border-radius:999px;padding:30px 70px}
#end p{margin-top:40px;font-size:38px;color:#B9C9BE;font-weight:500}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:40}
</style></head><body>
<div id="cam">
 <div id="chat">
  <svg id="wall" width="1280" height="2120" fill="none" stroke="#9ED9B0" stroke-width="2"></svg>
  <div id="msgs"></div>
  <div id="hdr"><div id="sbar"><span>19:42</span><span>●●●● 5G ▮</span></div>
   <div id="ghead"><span class="back">‹</span><div id="gav">⛳</div><div><b>Golf los sábados</b><span id="gsub">Luis, Marta, Paco, Tú</span></div></div></div>
  <div id="input"><div class="f">Mensaje</div><div class="s"><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>
  <div id="hookbg"></div>
  <div id="hook">Cada jueves, en <span class="g">todos</span><br>los grupos de golf:</div>
 </div>
 <div id="web"><div id="wbar"><small>Cerrar</small>🔒 banderin.es</div><iframe id="wf" src="/#inicio" scrolling="no"></iframe><div id="tap"></div></div>
</div>
<div id="end"><img src="/icons/icon-512.png" alt=""><h2>Pásaselo a tu<br><span>grupo de golf.</span></h2><div class="u">banderin.es</div><p>Gratis · Todos los torneos de golf de España</p></div>
<div id="flash"></div>
<script>
const $=id=>document.getElementById(id),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
(function(){let h='';[[300,500],[1000,1300],[300,1900]].forEach(([cx,cy],k)=>{for(let i=1;i<=14;i++)h+=`<ellipse cx="${cx+i*9}" cy="${cy-i*6}" rx="${60*i+k*17}" ry="${42*i+(i%3)*14}" transform="rotate(${-18+k*25+i*1.5} ${cx} ${cy})"/>`});$('wall').innerHTML=h})();
const P={Luis:['#E9C77E','L'],Marta:['#9FD3B4','M'],Paco:['#F0A989','P']};
const M=[
 [0.30,'Luis','¿Alguien sabe de algún torneo este finde? 🏌️'],
 [1.40,'Marta','Ni idea 🤷‍♀️'],
 [2.30,'Paco','Mira en la web de la federación'],
 [3.30,'Luis','¿De cuál de las 17? 😂',1.12],
 [4.50,'Marta','El finde pasado me tiré 2 horas mirando PDFs'],
 [5.80,'Paco','Y cuando lo encontré, inscripción cerrada 🙃'],
 [7.20,'me','LINK',1.06],
 [8.30,'me','Están todos. 127 este finde 👇'],
 [13.95,'Luis','¿Y es gratis? 👀'],
 [14.85,'me','Gratis. Y te avisa cuando abren la inscripción 🔔'],
 [16.00,'Marta','¿Cómo no conocía esto? 😳',1.08],
 [17.00,'Paco','Apuntado. El sábado nos vemos ⛳🔥'],
];
window.MSGS=M.map(m=>m[0]);
const box=$('msgs');
M.forEach((m,i)=>{const me=m[1]==='me',d=document.createElement('div');d.className='m'+(me?' me':'');d.id='m'+i;
  const tm='<span class="tm">19:'+(42+Math.floor(i/3))+'</span>';
  let body;
  if(m[2]==='LINK')body=`<div class="b lp"><img src="/og.png?v=2" alt=""><div class="tx"><b>Banderín · Todos los torneos de golf de España</b><small>Fechas, campos y enlace para inscribirte. Gratis.</small><u>banderin.es</u></div></div>`;
  else body=`<div class="b">${me?'':`<span class="n" style="color:${['#A07A2E','#2C8A58','#C0603A'][['Luis','Marta','Paco'].indexOf(m[1])]}">${m[1]}</span>`}${m[2]}${tm}</div>`;
  d.innerHTML=(me?'':`<div class="av" style="background:${P[m[1]][0]}">${P[m[1]][1]}</div>`)+body;
  box.appendChild(d);
  if(!me){const ty=document.createElement('div');ty.className='m';ty.id='ty'+i;ty.innerHTML=`<div class="av" style="background:${P[m[1]][0]}">${P[m[1]][1]}</div><div class="b typing"><i></i><i></i><i></i></div>`;ty.style.position='absolute';ty.style.left='40px';box.appendChild(ty)}
});
let H=[];
function measure(){H=M.map((m,i)=>$('m'+i).offsetHeight+22)}
const WEB0=9.25,WEB1=13.6,TAP=10.55,END0=18.3,DUR=21.6;window.DUR=DUR;
let tapped=false;
window.render=function(t){let wait=0;
  // mensajes visibles y posición del chat (sigue al último mensaje)
  const vis=M.map((m,i)=>t>=m[0]);
  let y=0;const ys=[];M.forEach((m,i)=>{ys.push(y);if(vis[i])y+=H[i]*eo(seg(t,m[0],m[0]+.25))});
  // indicador de escribiendo
  let typingH=0;M.forEach((m,i)=>{const ty=$('ty'+i);if(!ty)return;const on=t>=m[0]-.55&&t<m[0]&&!(m[0]>WEB0&&t<WEB1+.2);ty.style.opacity=on?1:0;
    if(on){typingH=130;ty.style.top=y+'px';ty.querySelectorAll('i').forEach((d,j)=>d.style.transform=`translateY(${-10*Math.max(0,Math.sin(t*14-j*.9))}px)`)}});
  const bottom=1690;const total=y+typingH;const off=bottom-total;
  box.style.transform=`translateY(${off}px)`;
  M.forEach((m,i)=>{const e=$('m'+i);e.style.position='absolute';e.style.left='40px';e.style.right='40px';e.style.top=ys[i]+'px';
    if(!vis[i]){e.style.opacity=0;return}const p=back(seg(t,m[0],m[0]+.32));e.style.opacity=cl(seg(t,m[0],m[0]+.08));e.style.transform=`scale(${.55+.45*p}) translateY(${(1-eo(seg(t,m[0],m[0]+.3)))*40}px)`});
  // cámara: golpes de zoom en mensajes clave + respiración
  let z=1+.008*Math.sin(t*1.7),fy=60;
  M.forEach((m,i)=>{if(m[3]){const a=seg(t,m[0],m[0]+.2),b=1-seg(t,m[0]+1.0,m[0]+1.3);z+= (m[3]-1)*eio(Math.min(a,b))}});
  $('cam').style.transform=`scale(${z.toFixed(4)})`;
  // gancho
  const hk=Math.min(eo(seg(t,0,.25)),1-eo(seg(t,1.25,1.55)));$('hook').style.opacity=hk;$('hookbg').style.opacity=hk;$('hook').style.transform=`scale(${.9+.1*back(seg(t,0,.4))})`;
  // web
  const wv=Math.min(eo(seg(t,WEB0,WEB0+.35)),1-eo(seg(t,WEB1,WEB1+.3)));const w=$('web');w.style.opacity=wv;
  w.style.transform=`scale(${.6+.4*eo(seg(t,WEB0,WEB0+.4))-.08*eo(seg(t,WEB1,WEB1+.3))}) translateY(${(1-eo(seg(t,WEB0,WEB0+.4)))*300}px)`;w.style.borderRadius=(1-eo(seg(t,WEB0,WEB0+.4)))*60+'px';
  try{const fw=$('wf').contentWindow,d=$('wf').contentDocument,b=d.getElementById('hLoc');
    if(b&&t>=WEB0-.5){const r=b.getBoundingClientRect(),S=2.7692,tp=$('tap');tp.style.left=(r.left+r.width/2)*S+'px';tp.style.top=(170+(r.top+r.height/2)*S)+'px';
      const q=seg(t,TAP-.3,TAP+.55);tp.style.opacity=(t>TAP-.3&&t<TAP+.55)?(q<.35?1:1-(q-.35)/.65):0;tp.style.transform=`scale(${q<.35?1-.25*(q/.35):.75+1.1*(q-.35)})`;
      if(t>=TAP&&!tapped){tapped=true;b.click();wait=1800}}
    const s0=0,s1=d.getElementById('weTitle')?d.getElementById('weTitle').getBoundingClientRect().top+fw.scrollY-150:900;
    fw.scrollTo(0,t<TAP+.4?110:110+(s1-110)*eio(seg(t,TAP+.5,TAP+1.6)))}catch(e){}
  // final
  const ev=eo(seg(t,END0,END0+.35));$('end').style.opacity=ev;
  const i1=back(seg(t,END0+.1,END0+.6));$('end').querySelector('img').style.transform=`scale(${.5+.5*i1})`;
  const h2=eo(seg(t,END0+.4,END0+.9));$('end').querySelector('h2').style.opacity=h2;$('end').querySelector('h2').style.transform=`translateY(${(1-h2)*40}px)`;
  const u=back(seg(t,END0+.95,END0+1.4));$('end').querySelector('.u').style.opacity=cl(seg(t,END0+.95,END0+1.1));$('end').querySelector('.u').style.transform=`scale(${.8+.2*u})`;
  $('end').querySelector('p').style.opacity=eo(seg(t,END0+1.4,END0+1.9));
  // destellos en cortes
  const fl=[WEB0+.05,END0].map(a=>t>=a&&t<a+.15?.5*(1-seg(t,a,a+.15)):0);$('flash').style.opacity=Math.max(...fl);
  document.body.style.opacity=1-seg(t,DUR-.3,DUR);
  return wait};
window.prep=async()=>{await document.fonts.ready;measure();const d=$('wf').contentDocument,st=d.createElement('style');st.textContent='*{animation:none!important;transition:none!important}::-webkit-scrollbar{display:none}#avFab,.avfab,#cbanner,nav.tabbar{display:none!important}';d.head.appendChild(st);render(0);return true};
</script></body></html>
