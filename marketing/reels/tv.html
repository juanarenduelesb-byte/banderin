<style>
html,body{background:#000}

.pg .gr b{height:96px;border-top:2px solid #d8d0bd;font-weight:600;font-size:28px;color:#777;padding:8px 10px}

#card{position:absolute;left:120px;right:120px;top:520px;background:#F4F1E8;border-radius:50px;overflow:hidden;color:#13201A;box-shadow:0 50px 120px rgba(0,0,0,.7)}
#card .il{height:330px;background:linear-gradient(160deg,#4F7F62,#22422F)}
#card .bd{padding:44px 50px 54px;font-family:"PS"}
#card h3{font-family:"CAS";font-weight:400;font-size:74px;margin:10px 0}
#cbtn{margin-top:36px;text-align:center;border-radius:999px;padding:30px;font-weight:700;font-size:44px;background:#163D2B;color:#fff}

/* final */
#web{position:absolute;left:230px;top:330px;width:620px;height:1300px;border-radius:84px;background:#0A0F0C;padding:18px;box-shadow:0 60px 140px rgba(0,0,0,.6)}
#web .s{position:relative;width:584px;height:1264px;border-radius:68px;overflow:hidden;background:#F4F1E8}
#wf{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform:scale(1.4974);transform-origin:0 0}
#endc{position:absolute;inset:0;background:radial-gradient(110% 80% at 50% 42%,#1F5139,#123323 55%,#071710);text-align:center;opacity:0}
#endc img{width:250px;height:250px;border-radius:58px;margin-top:560px;box-shadow:0 30px 90px rgba(0,0,0,.5)}
#endc .nm{font-family:"PS";font-weight:700;font-size:120px;letter-spacing:-.04em;margin-top:40px;color:#F4F1E8}
#endc h2{font-family:"CAS";font-weight:400;font-size:84px;line-height:1.05;margin:40px 90px 0;color:#F4F1E8}
#endc h2 span{color:#E9C77E}
#endc .u{display:inline-block;margin-top:70px;font-family:"PS";font-weight:700;font-size:64px;background:#F4F1E8;color:#163D2B;border-radius:999px;padding:26px 64px}
</style></head><body>

<div id="endc"><img src="/icons/icon-512.png" alt=""><div class="nm">banderín</div><h2 id="ih">Tu próximo torneo<br><span>empieza aquí.</span></h2><div class="u">banderin.es</div></div>

<script>
const DUR=31,E=24.0;window.DUR=DUR;
// textos palabra a palabra: [id, html, inicio, fin, palabras por segundo]
function words(id,html){const el=$(id);el.innerHTML=html.split(' ').map(w=>'<span class="w">'+w+'</span>').join(' ');return [...el.querySelectorAll('.w')]}
const TX={tA:['Todos tenemos <i>uno.</i>',1.0,2.95,4],
 tB:['Ese torneo que íbamos a jugar… <i>el año que viene.</i>',3.0,7.4,3.2],
 tC:['Porque nos enteramos <i>tarde.</i>',7.6,9.6,5],
 tD:['Porque no sabíamos <i>dónde mirar.</i>',9.9,12.1,5],
 tE:['Porque, cuando llegamos… <i>ya estaba cerrado.</i>',12.4,15.4,3.2],
 tF:['Este año, <i>no.</i>',16.7,18.3,3],
 tG:['Todos los torneos de golf <i>de España.</i>',19.3,21.4,4.5],
 tG2:['En un solo <i>sitio.</i>',21.9,24.0,4]};
const W={};for(const k in TX)W[k]=words(k,TX[k][0]);
function txt(t){for(const k in TX){const [_,a,b,r]=TX[k];const ws=W[k];ws.forEach((w,i)=>{const s=a+i/r,p=eo(seg(t,s,s+.45));w.style.opacity=Math.min(p,1-seg(t,b-.35,b));w.style.transform=`translateY(${(1-p)*24}px)`;w.style.filter=`blur(${(1-p)*8}px)`})}}
// calendario: tres años
const cal=$('cal');const YRS=[2024,2025,2026];
YRS.forEach((y,i)=>{const d=document.createElement('div');d.className='pg';d.id='pg'+i;d.style.zIndex=10-i;
 d.innerHTML=`<div class="hd">Junio<span>${y}</span></div><div class="gr">${Array.from({length:35},(_,k)=>`<b>${k<30?k+1:''}</b>`).join('')}</div><div class="ring" style="left:${485}px;top:${380}px"></div><div class="nt" style="left:130px;top:${700}px">${i<2?'el año que viene…':'¿este año?'}</div>`;cal.appendChild(d)});
// ventanas
const WS=[];for(let i=0;i<14;i++){const d=document.createElement('div');d.className='win';const r=n=>{const x=Math.sin(i*12.9898+n*78.233)*43758.5453;return x-Math.floor(x)};
 d.innerHTML='<div class="bar"><i></i><i style="background:#E6B54A"></i><i style="background:#5BB26A"></i></div>'+'<div class="ln"></div>'.repeat(22);
 d.dataset.x=-80+r(1)*520;d.dataset.y=160+r(2)*900;d.dataset.r=(r(3)-.5)*24;d.dataset.z=r(4);$('wins').appendChild(d);WS.push(d)}
const rays=$('rays');for(let i=0;i<9;i++){const a=-160+i*17.5;const l=document.createElementNS('http://www.w3.org/2000/svg','line');const R=Math.PI*a/180;l.setAttribute('x1',540);l.setAttribute('y1',980);l.setAttribute('x2',540+Math.cos(R)*1400);l.setAttribute('y2',980+Math.sin(R)*1400);l.setAttribute('opacity',.18);rays.appendChild(l)}
const CL=(id,o)=>$(id).style.opacity=o;
window.render=function(t){let wait=0;
  // escena 1/7: campo
  const s1=Math.max(vis(t,0,3.1,.9,.25),vis(t,18.25,21.55,.06,.2));CL('s1',s1);
  const warm=t>18;const k=warm?eo(seg(t,18.25,20.5)):0;
  $('skyw').setAttribute('opacity',k);$('sunc').setAttribute('opacity',k);$('sunc').setAttribute('cy',1060-200*eio(seg(t,18.25,21.5)));
  $('rays').setAttribute('opacity',.9*k);$('rays').setAttribute('transform',`rotate(${(t-18)*2} 540 980)`);
  $('grade').setAttribute('opacity',warm?.25*(1-k):.25);$('grade').setAttribute('fill',warm?'#3A1E00':'#0D1B2A');
  $('fogb').setAttribute('transform',`translate(${(t%40)*6-60},0)`);
  const push=warm?1+.08*seg(t,18.25,21.55):1.02+.07*seg(t,0,3.1);
  [['h3',.25],['h2',.55],['h1',1]].forEach(([id,f])=>$(id).setAttribute('transform',`translate(${540*(1-1-(push-1)*f)} ${1100*(-(push-1)*f)}) scale(${1+(push-1)*f})`));
  $('h2').querySelector('path').setAttribute('fill',warm?'#3D6B4B':'#2C4A3A');$('h1').querySelector('path').setAttribute('fill',warm?'#264A35':'#1C3326');$('h3').querySelector('path').setAttribute('fill',warm?'#6B8F6E':'#3B5A4A');
  $('green').setAttribute('fill',warm?'#6FAE7E':'#4E7F5C');
  const wv=Math.sin(t*5)*6;$('flagp').setAttribute('d',`M663 1003 Q712 ${1012+wv} 760 ${1030+wv*.6} Q712 ${1046-wv*.4} 663 1058 Z`);
  // la bola entra en el hoyo
  const bp=seg(t,19.0,20.9),bx=300+(660-300)*eo(bp);const ball=$('ball');ball.setAttribute('opacity',t>19&&t<21.05?1:0);ball.setAttribute('cx',bx);ball.setAttribute('cy',1190-6*Math.sin(Math.PI*bp)+(t>20.9?8*seg(t,20.9,21.0):0));ball.setAttribute('r',12*(1-.5*seg(t,20.9,21.0)));
  // escena 2: calendario
  CL('s2',vis(t,2.95,7.45,.3,.3));
  YRS.forEach((y,i)=>{const fl=[4.55,5.75,99][i];const p=eio(seg(t,fl,fl+.55));$('pg'+i).style.transform=`rotateX(${p*-175}deg)`;$('pg'+i).style.opacity=p>.98?0:1;
    $('pg'+i).querySelector('.ring').style.clipPath=`inset(0 ${100-100*eo(seg(t,3.4+i*1.2,3.9+i*1.2))}% 0 0)`;$('pg'+i).querySelector('.nt').style.opacity=eo(seg(t,3.8+i*1.2,4.2+i*1.2))});
  $('cal').style.transform=`scale(${1+.05*seg(t,3,7.4)}) rotate(${-1.5+seg(t,3,7.4)}deg)`;
  // escena 3: chat
  CL('s3',vis(t,7.4,9.75,.2,.2));
  [['m1',7.55],['m2',8.1],['m3',8.75]].forEach(([id,a])=>{const p=back(seg(t,a,a+.35));$(id).style.opacity=cl(seg(t,a,a+.1));$(id).style.transform=`translateY(${(1-p)*40}px) scale(${.92+.08*p})`});
  $('s3').querySelector('.ph').style.transform=`scale(${1.0+.08*seg(t,7.4,9.75)})`;
  // escena 4: ventanas
  CL('s4',vis(t,9.7,12.2,.15,.2));
  WS.forEach((d,i)=>{const a=9.75+i*.11,p=back(seg(t,a,a+.3));d.style.opacity=cl(seg(t,a,a+.05));const z=+d.dataset.z;
    d.style.transform=`translate(${+d.dataset.x+(t-10)*30*(z-.5)}px,${+d.dataset.y}px) rotate(${d.dataset.r}deg) scale(${(.55+.35*z)*(.7+.3*p)})`;d.style.filter=`blur(${(1-z)*6*seg(t,10.5,12)}px) brightness(${.6+.4*z})`});
  // escena 5: tarjeta cerrada
  CL('s5',vis(t,12.2,15.45,.25,.35));
  const cp=eo(seg(t,12.2,12.8));$('card').style.transform=`translateY(${(1-cp)*120}px) scale(${1.04-.04*seg(t,12.2,15.4)})`;
  const r=$('cbtn').getBoundingClientRect();const tp=tapAt($('tap'),t,13.6,r.left+r.width/2,r.top+r.height/2);if(!tp)$('tap').style.opacity=0;
  const cl0=t>14.35;$('cbtn').textContent=cl0?'Inscripción cerrada':'Inscribirme';$('cbtn').style.background=cl0?'#9A958A':'#163D2B';
  $('stamp').style.opacity=t<14.35?0:1;$('stamp').style.transform=`rotate(-8deg) scale(${2.1-1.1*eo(seg(t,14.35,14.55))})`;
  const sh=t>14.5&&t<14.95?Math.sin(t*95)*14*(1-seg(t,14.5,14.95)):0;$('s5').style.transform=`translateX(${sh}px)`;
  $('s5').style.filter=`saturate(${.75-.6*seg(t,14.6,15.4)})`;
  // escena 6
  CL('s6',vis(t,16.5,18.32,.2,.04));$('tF').style.transform=`scale(${1+.06*seg(t,16.7,18.3)})`;
  // escena 8: la web
  const s8=vis(t,21.45,E+.05,.2,.05);CL('s8',s8);$('web').style.transform=`translateY(${(1-eo(seg(t,21.45,22.1)))*260}px) scale(${.96+.04*seg(t,21.45,24)})`;
  try{const fw=$('wf').contentWindow;fw.scrollTo(0,900*eio(seg(t,21.7,23.9)))}catch(e){}
  // final
  const ev=eo(seg(t,E,E+.5));CL('endc',ev);const ec=$('endc');
  ec.querySelector('img').style.transform=`scale(${.6+.4*back(seg(t,E+.05,E+.7))})`;
  const nm=ec.querySelector('.nm');nm.style.opacity=eo(seg(t,E+.35,E+.9));nm.style.letterSpacing=(-.04+.04*(1-eo(seg(t,E+.35,E+1.4))))+'em';
  const h=eo(seg(t,25.35,26.0));$('ih').style.opacity=h;$('ih').style.transform=`translateY(${(1-h)*40}px)`;
  const u=back(seg(t,26.6,27.1));const U=ec.querySelector('.u');U.style.opacity=cl(seg(t,26.6,26.75));U.style.transform=`scale(${.8+.2*u})`;
  txt(t);
  $('turb').setAttribute('seed',Math.floor(t*24)%97);
  flash(t,[18.3]);document.body.style.opacity=Math.min(1,t/.6)*(1-seg(t,DUR-.6,DUR));
  return wait};
window.prep=async()=>{await document.fonts.ready;const d=$('wf').contentDocument,st=d.createElement('style');st.textContent='*{animation:none!important;transition:none!important}::-webkit-scrollbar{display:none}#avFab,.avfab,#cbanner{display:none!important}';d.head.appendChild(st);try{const f=d.getElementById('fst');f.value='open';f.dispatchEvent(new Event('change',{bubbles:true}));f.dispatchEvent(new Event('input',{bubbles:true}))}catch(e){}await new Promise(r=>setTimeout(r,600));render(0);return true};
</script></body></html>
